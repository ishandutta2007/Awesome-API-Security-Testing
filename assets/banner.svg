<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="320" fill="url(#grid)" rx="16"/>

  <!-- Dynamic Glowing Elements (Background decoration) -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="100;140;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="1050" cy="240" r="150" fill="#ec4899" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="130;170;130" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Glowing Network Waves / Scanlines -->
  <path d="M -100 220 Q 300 120 600 220 T 1300 180" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.4">
    <animate attributeName="d" values="M -100 220 Q 300 120 600 220 T 1300 180; M -100 180 Q 300 240 600 180 T 1300 220; M -100 220 Q 300 120 600 220 T 1300 180" dur="10s" repeatCount="indefinite"/>
  </path>
  
  <path d="M -100 100 Q 400 280 800 100 T 1300 200" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3">
    <animate attributeName="d" values="M -100 100 Q 400 280 800 100 T 1300 200; M -100 140 Q 400 60 800 220 T 1300 120; M -100 100 Q 400 280 800 100 T 1300 200" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- Foreground Shield / Lock Icon -->
  <g transform="translate(100, 90)">
    <path d="M40 10 L80 30 V70 C80 105 40 125 40 125 C40 125 0 105 0 70 V30 L40 10 Z" fill="none" stroke="url(#accent-grad)" stroke-width="4" filter="url(#glow)"/>
    <path d="M40 20 L70 36 V66 C70 94 40 110 40 110 C40 110 10 94 10 66 V36 L40 20 Z" fill="#1e1b4b" opacity="0.8"/>
    <path d="M30 55 H50 V75 H30 Z M40 43 A 8 8 0 0 0 32 51 V55 H48 V51 A 8 8 0 0 0 40 43 Z" fill="url(#accent-grad)"/>
  </g>

  <!-- Title & Subtitle (Foreground, Crisp & Clear) -->
  <g transform="translate(220, 130)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="url(#text-grad)" letter-spacing="1">
      Awesome API Security Testing
    </text>
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0.5">
      Curated DAST, OpenAPI/GraphQL Fuzzing, BOLA Detection &amp; SaaS Platforms
    </text>
  </g>

  <!-- Tech Badges inside Banner -->
  <g transform="translate(220, 215)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="70" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">🛡️ DAST &amp; Fuzzing</text>
    
    <!-- Pill 2 -->
    <rect x="155" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="230" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">🔍 OWASP API Top 10</text>
    
    <!-- Pill 3 -->
    <rect x="320" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="400" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">⚡ GraphQL &amp; REST</text>
  </g>
</svg>
